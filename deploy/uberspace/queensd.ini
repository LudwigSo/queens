; Install as ~/etc/services.d/queensd.ini, then:
;   supervisorctl reread && supervisorctl update
; supervisord expands %(ENV_HOME)s, so this file needs no templating. The port
; is not here on purpose: it lives once in ~/etc/queensd.env.
[program:queensd]
command=%(ENV_HOME)s/bin/queensd-run
directory=%(ENV_HOME)s/queens

autostart=true
; Not `true`: queensd exits 1 on a configuration error, and `true` would
; restart-loop a bad pepper for ever instead of going FATAL after startretries.
autorestart=unexpected
exitcodes=0
; Boot applies migrations and re-imports the level set before it binds.
startsecs=5
startretries=3

stopsignal=TERM
; serve() gives http.Shutdown 15s and only then checkpoints the WAL. The
; supervisord default of 10s would SIGKILL before the checkpoint every time.
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Everything, including one access-log line per request, goes to stderr.
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/logs/queensd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
