name: Server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - server/**
      - shared/**
      - queens/levels/**
      - queens/shared/**
      - queens/scripts/scoring.gd
      - queens/scripts/league_rules.gd
      - queens/tools/gen_fixtures.gd
      - .github/workflows/server.yml
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go build ./...

      # Covers the cross-language parity fixtures, the 4-million-case sweep,
      # the OpenAPI drift check and the two file-in-sync checks.
      - run: go test -race -count=1 ./...

      # Belt and braces: the drift test above compares against the same
      # generator, so regenerate independently and diff the checked-in file.
      - name: OpenAPI is up to date
        run: |
          go run ./cmd/queensd openapi -o "$RUNNER_TEMP/openapi.yaml"
          diff -u openapi.yaml "$RUNNER_TEMP/openapi.yaml"

      - name: Cross-compile for the target
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o dist/queensd-linux-arm64 ./cmd/queensd

      - uses: actions/upload-artifact@v4
        with:
          name: queensd-linux-arm64
          path: server/dist/queensd-linux-arm64

  fixtures:
    name: Fixtures and client suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -sSfLo godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo install -m755 Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - run: godot --headless --path queens --import

      # The fixtures are the contract between the engine and the Go port.
      # Regenerating them here means a scoring change has to be committed
      # together with every expected value it moves, in front of a reviewer.
      - name: Fixtures are current
        run: |
          godot --headless --path queens --script tools/gen_fixtures.gd
          git diff --exit-code -- shared/fixtures/

      - name: Client test suite
        run: godot --headless --path queens --script tests/run_tests.gd
