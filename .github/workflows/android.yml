name: Android APK

# Two callers:
#   * push to main / manual -- build and sign an APK as a CI artifact only.
#   * the Release workflow  -- the same build, published as a GitHub release.
# The version is an input so that the release owns the numbering; a CI build
# gets an obviously-not-a-release 0.0.<run> instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Marketing version, e.g. 1.0.9
        type: string
        required: true
      version_code:
        description: Android versionCode; must only ever increase
        type: string
        required: true
      publish:
        description: Create the GitHub release
        type: boolean
        default: false

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Maven Central rate-limits shared runner IPs (HTTP 429), and a cold
      # Gradle build fetches ~100 artifacts. The Godot build template pins the
      # Gradle/AGP/Kotlin versions, so the Godot version is the cache key.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-godot-${{ env.GODOT_VERSION }}

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Secrets pasted into the web UI often carry a trailing newline; strip it.
          ks="$RUNNER_TEMP/release.keystore"
          alias=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          pass=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:cntrl:]')
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$ks"

          if ! keytool -list -keystore "$ks" -storepass "$pass" -alias "$alias" >/dev/null 2>&1; then
            echo "::error::Keystore rejected the alias or password. keytool says:"
            keytool -list -keystore "$ks" -storepass "$pass" 2>&1 | head -20
            echo "Alias names above come from the keystore itself; the ANDROID_KEY_ALIAS secret shows as ***."
            exit 1
          fi
          echo "Keystore, alias and password check out."

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -sSfLo godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSfLo templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && sudo install -m755 Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # A release APK must not ship a build that fails its own tests. The
      # 4-million-case sweep runs in the server workflow instead, where it is
      # compared against the Go port.
      - name: Test suite
        working-directory: queens
        env:
          QUEENS_FAST_TESTS: "1"
        run: |
          "$ANDROID_HOME/platform-tools/adb" start-server
          godot --headless --import
          godot --headless --script tests/run_tests.gd

      - name: Stamp the version
        working-directory: queens
        run: |
          sed -i "s|^version/code=.*|version/code=$VERSION_CODE|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"$VERSION\"|" export_presets.cfg
          # The build number reaches the server with every result, so a bug can
          # be traced to the build that produced it.
          sed -i "s|^var client_version: String = .*|var client_version: String = \"$VERSION\"|" scripts/config.gd
          # The production URL is committed in config.gd; this only overrides
          # it, so a build can be pointed at a staging server without a commit.
          if [ -n "${{ vars.QUEENS_SERVER_URL }}" ]; then
            sed -i "s|^const SERVER_URL_RELEASE := .*|const SERVER_URL_RELEASE := \"${{ vars.QUEENS_SERVER_URL }}\"|" scripts/config.gd
          fi
          grep -E '^(version/code|version/name)=' export_presets.cfg
          grep -E '^(var client_version|const SERVER_URL_RELEASE)' scripts/config.gd

      - name: Export signed APK
        working-directory: queens
        run: |
          mkdir -p build
          "$ANDROID_HOME/platform-tools/adb" start-server
          godot --headless --import
          # A cold cache can still hit a 429; downloads that succeeded stay in
          # ~/.gradle, so each retry asks Maven Central for less.
          for attempt in 1 2 3; do
            if godot --headless --install-android-build-template --export-release Android build/queens.apk \
                && [ -f build/queens.apk ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android export failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 60))
            echo "::warning::Android export failed (attempt $attempt), retrying in ${delay}s."
            sleep "$delay"
          done
          # Release Gradle's lock files before the cache post-step saves ~/.gradle.
          pkill -f GradleDaemon || true

      - uses: actions/upload-artifact@v4
        with:
          name: queens-apk-${{ env.VERSION }}
          path: queens/build/queens.apk

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" queens/build/queens.apk \
            --title "Queens $VERSION" \
            --notes "Automated release from ${{ github.sha }}"
