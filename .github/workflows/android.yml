name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Secrets pasted into the web UI often carry a trailing newline; strip it.
          ks="$RUNNER_TEMP/release.keystore"
          alias=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          pass=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:cntrl:]')
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$ks"

          if ! keytool -list -keystore "$ks" -storepass "$pass" -alias "$alias" >/dev/null 2>&1; then
            echo "::error::Keystore rejected the alias or password. keytool says:"
            keytool -list -keystore "$ks" -storepass "$pass" 2>&1 | head -20
            echo "Alias names above come from the keystore itself; the ANDROID_KEY_ALIAS secret shows as ***."
            exit 1
          fi
          echo "Keystore, alias and password check out."

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -sSfLo godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSfLo templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && sudo install -m755 Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Set version from run number
        working-directory: queens
        run: |
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${{ github.run_number }}\"|" export_presets.cfg

      - name: Export signed APK
        working-directory: queens
        run: |
          mkdir -p build
          "$ANDROID_HOME/platform-tools/adb" start-server
          godot --headless --import
          godot --headless --install-android-build-template --export-release Android build/queens.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.${{ github.run_number }} queens/build/queens.apk \
            --title "Queens 1.0.${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}"
